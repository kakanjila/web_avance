services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile-php
    ports:
      - "8080:80"
    volumes:
      - ../src:/var/www/html
    depends_on:
      - db
  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: seo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
